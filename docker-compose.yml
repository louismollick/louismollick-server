services:
  traefik:
    image: traefik:v3.7.16
    restart: unless-stopped
    command:
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entryPoint.to=websecure
      - --entrypoints.web.http.redirections.entryPoint.scheme=https
      - --certificatesresolvers.le.acme.email=louismollick@gmail.com
      - --certificatesresolvers.le.acme.storage=/acme.json
      - --certificatesresolvers.le.acme.httpchallenge=true
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
      - --api.dashboard=false
      - --log.level=INFO
      - --accesslog=true
      - --providers.file.filename=/etc/traefik/routes.yml
      - --providers.file.watch=true
      - --entrypoints.websecure.http.middlewares=security-headers@file
      - --accesslog.format=json
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./traefik/routes.yml:/etc/traefik/routes.yml:ro
      - ./traefik/acme.json:/acme.json
    networks:
      - anki
      - lyrics
      - music
      - kashi
      - sure-web
    labels:
      - com.centurylinklabs.watchtower.enable=true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    mem_limit: 256m
    pids_limit: 100
    user: 1001:1001
  anki-desktop:
    image: ghcr.io/louismollick/anki-desktop-docker:main
    restart: unless-stopped
    mem_limit: 2g
    memswap_limit: 2g
    env_file:
      - .env-anki
    volumes:
      - ./volumes/anki_data:/config
    networks:
      - anki
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python3 -c 'import json,os,urllib.request; r=urllib.request.Request("http://127.0.0.1:8765",data=json.dumps({"action":"version","version":6,"key":os.environ["ANKICONNECT_API_KEY"]}).encode());
          result=json.load(urllib.request.urlopen(r,timeout=5)); assert result.get("error") is None and
          result.get("result")==6' && gui_status="$$(curl -sS --max-time 5 -o /dev/null -w '%{http_code}'
          http://127.0.0.1:3000)" && [ "$$gui_status" -ge 200 ] && [ "$$gui_status" -lt 500 ]
      start_period: 5m
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - com.louismollick.anki-cleanup=true
      - com.centurylinklabs.watchtower.enable=true
    pids_limit: 512
  anki-cleanup:
    image: docker:27-cli@sha256:851f91d241214e7c6db86513b270d58776379aacc5eb9c4a87e5b47115e3065c
    restart: unless-stopped
    network_mode: none
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      TZ: UTC
    command:
      - /bin/sh
      - -c
      - |
        while true; do
          target="$$(docker ps -q --filter label=com.louismollick.anki-cleanup=true)"
          if [ -z "$$target" ]; then
            sleep 60
            continue
          fi

          health="$$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$$target")"
          memory="$$(docker stats --no-stream --format '{{.MemPerc}}' "$$target" | tr -d '%')"
          reason=""

          if [ "$$health" = "unhealthy" ]; then
            reason="Anki API unhealthy"
          elif awk -v percent="$$memory" 'BEGIN { exit !(percent >= 75) }'; then
            reason="memory at $${memory}%"
          fi

          if [ -n "$$reason" ]; then
            echo "$$(date -u +'%Y-%m-%dT%H:%M:%SZ') restarting Anki: $$reason"
            docker restart "$$target"
          fi

          sleep 60
        done
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  spotify-lyrics-api:
    image: ghcr.io/louismollick/spotify-lyrics-api:main
    restart: unless-stopped
    env_file:
      - .env-lyrics
    networks:
      - lyrics
    labels:
      - com.centurylinklabs.watchtower.enable=true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 256m
    pids_limit: 100
  shigoto:
    image: ghcr.io/louismollick/shigoto:main
    restart: unless-stopped
    mem_limit: 1g
    env_file:
      - .env-shigoto
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /data/google.json
    volumes:
      - ./volumes/shigoto_data:/data
    labels:
      - com.centurylinklabs.watchtower.enable=true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - shigoto
    pids_limit: 256
  navidrome:
    image: deluan/navidrome:latest
    restart: unless-stopped
    env_file:
      - .env-navidrome
    environment:
      ND_DATAFOLDER: /data
      ND_MUSICFOLDER: /music
      ND_SCANNER_PURGEMISSING: full
      ND_TRANSCODING_MAXCONCURRENT: 2
      ND_TRANSCODING_MAXCONCURRENTPERUSER: 2
    volumes:
      - ./volumes/navidrome_data:/data
      - ./music:/music:ro
    networks:
      - music
    labels:
      - com.centurylinklabs.watchtower.enable=true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: 1000:1000
    mem_limit: 1g
    pids_limit: 128
  kashi-server:
    # Song analyses for the Kashi-Koi app (github.com/louismollick/kashi-koi, apps/server).
    # pr-8 is the PR build; switch to :main once the PR is merged.
    image: ghcr.io/louismollick/kashi-koi-server:main
    restart: unless-stopped
    env_file:
      - .env-kashi
    environment:
      NAVIDROME_URL: http://navidrome:4533
    volumes:
      - kashi_data:/data
    networks:
      - kashi
      - music
    labels:
      - com.centurylinklabs.watchtower.enable=true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 1g
    pids_limit: 256
  sure-web:
    image: ghcr.io/louismollick/louismollick-server-sure:main
    restart: unless-stopped
    env_file:
      - .env-sure
    environment: &sure_env
      SELF_HOSTED: "true"
      APP_DOMAIN: budget.louismollick.com
      RAILS_FORCE_SSL: "true"
      RAILS_ASSUME_SSL: "true"
      POSTGRES_USER: sure_user
      POSTGRES_DB: sure_production
      DB_HOST: sure-db
      DB_PORT: 5432
      REDIS_URL: redis://sure-redis:6379/1
    # Tailscale's MagicDNS resolves the Mac's *.ts.net hostname and forwards
    # everything else upstream. Requires Tailscale on the VPS host.
    dns: &sure_dns
      - 100.100.100.100
      - 1.1.1.1
    volumes:
      - sure_storage:/rails/storage
    depends_on: &sure_depends
      sure-db:
        condition: service_healthy
      sure-redis:
        condition: service_healthy
    networks:
      - sure-web
      - sure
    labels: []
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 2g
    pids_limit: 256
  sure-worker:
    image: ghcr.io/louismollick/louismollick-server-sure:main
    restart: unless-stopped
    command: bundle exec sidekiq
    env_file:
      - .env-sure
    environment: *sure_env
    dns: *sure_dns
    volumes:
      - sure_storage:/rails/storage
    depends_on: *sure_depends
    networks:
      - sure
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 2g
    pids_limit: 256
  sure-db:
    image: postgres:16
    restart: unless-stopped
    env_file:
      - .env-sure-db
    environment:
      POSTGRES_USER: sure_user
      POSTGRES_DB: sure_production
    volumes:
      - ./volumes/sure_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sure

    pids_limit: 100
  sure-redis:
    image: redis:7
    restart: unless-stopped
    volumes:
      - sure_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sure

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    pids_limit: 100
    user: redis
  minecraft:
    image: ghcr.io/louismollick/louismollick-server-minecraft:main
    container_name: minecraft
    restart: unless-stopped
    ports:
      - "25565:25565"
    env_file:
      - ${MINECRAFT_SERVER_DIR:-/home/ubuntu/minecraft-server}/.env
    environment:
      EULA: "TRUE"
      TYPE: "PAPER"
      VERSION: "26.2"
      MEMORY: "5G"
      USE_AIKAR_FLAGS: "true"
      MAX_PLAYERS: "5"
      VIEW_DISTANCE: "16"
      SIMULATION_DISTANCE: "6"
      ONLINE_MODE: "TRUE"
      ENABLE_WHITELIST: "TRUE"
      ENFORCE_WHITELIST: "TRUE"
      WHITELIST: "Ruiisuuu,azerX420,Eskodas"
      OPS: "Ruiisuuu"
      ENABLE_RCON: "true"
      MOTD: "Friends Minecraft Server"
    volumes:
      - ${MINECRAFT_SERVER_DIR:-/home/ubuntu/minecraft-server}/data:/data
    healthcheck:
      test: ["CMD", "mc-health"]
      start_period: 2m
      interval: 30s
      timeout: 10s
      retries: 5

    networks:
      - minecraft
    mem_limit: 7g
    pids_limit: 512
  minecraft-backup:
    image: itzg/mc-backup:latest
    container_name: minecraft-backup
    user: "1000:1000"
    restart: unless-stopped
    depends_on:
      minecraft:
        condition: service_healthy
    env_file:
      - ${MINECRAFT_SERVER_DIR:-/home/ubuntu/minecraft-server}/.env
    environment:
      RCON_HOST: "minecraft"
      BACKUP_INTERVAL: "24h"
      INITIAL_DELAY: "2m"
      PRUNE_BACKUPS_COUNT: "14"
      PAUSE_IF_NO_PLAYERS: "false"
    volumes:
      - ${MINECRAFT_SERVER_DIR:-/home/ubuntu/minecraft-server}/data:/data:ro
      - ${MINECRAFT_SERVER_DIR:-/home/ubuntu/minecraft-server}/backups:/backups

    networks:
      - minecraft
  watchtower:
    image: containrrr/watchtower:latest
    restart: unless-stopped
    environment:
      DOCKER_API_VERSION: "1.44"
    command:
      - --interval
      - "300"
      - --cleanup
      - --rolling-restart
      - --label-enable
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - updates
    read_only: true
    mem_limit: 128m
    pids_limit: 100
networks:
  anki: {}
  lyrics: {}
  music: {}
  kashi: {}
  sure-web: {}
  sure: {}
  shigoto: {}
  updates: {}
  minecraft: {}

volumes:
  # Named so Docker gives the image's non-root user ownership of it.
  kashi_data:
  sure_storage:
  sure_redis:
