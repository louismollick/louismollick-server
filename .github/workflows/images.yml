name: Security-maintained images
on:
  push:
    branches: [main]
    paths: ["sure/**", "minecraft-server/Dockerfile", ".github/workflows/images.yml"]
  workflow_dispatch:
  schedule:
    - cron: "43 5 * * *"
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - file: sure/Dockerfile
            image: louismollick-server-sure
          - file: minecraft-server/Dockerfile
            image: louismollick-server-minecraft
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          pull: true
          no-cache: ${{ github.event_name == 'schedule' }}
          push: true
          tags: |
            ghcr.io/louismollick/${{ matrix.image }}:main
            ghcr.io/louismollick/${{ matrix.image }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
