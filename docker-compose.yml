services:
  traefik:
    image: traefik:v3.7.1
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entryPoint.to=websecure
      - --entrypoints.web.http.redirections.entryPoint.scheme=https
      - --certificatesresolvers.le.acme.email=louismollick@gmail.com
      - --certificatesresolvers.le.acme.storage=/acme.json
      - --certificatesresolvers.le.acme.httpchallenge=true
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
      - --api.dashboard=false
      - --log.level=INFO
      - --accesslog=true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/acme.json:/acme.json
    networks:
      - traefik-public
    labels:
      - com.centurylinklabs.watchtower.enable=true

  anki-desktop:
    image: ghcr.io/louismollick/anki-desktop-docker:main
    restart: unless-stopped
    mem_limit: 2g
    memswap_limit: 2g
    env_file:
      - .env-anki
    volumes:
      - ./volumes/anki_data:/config
    networks:
      - traefik-public
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fsS --max-time 5 -H 'Content-Type: application/json'
          -d '{"action":"version","version":6}' http://127.0.0.1:8765
          | grep -qE '"error"[[:space:]]*:[[:space:]]*null'
          && gui_status="$$(curl -sS --max-time 5 -o /dev/null -w '%{http_code}' http://127.0.0.1:3000)"
          && [ "$$gui_status" -ge 200 ] && [ "$$gui_status" -lt 500 ]
      start_period: 5m
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - traefik.enable=true
      - "traefik.http.routers.anki-ui.rule=Host(`anki.louismollick.com`)"
      - traefik.http.routers.anki-ui.entrypoints=websecure
      - traefik.http.routers.anki-ui.tls=true
      - traefik.http.routers.anki-ui.tls.certresolver=le
      - traefik.http.routers.anki-ui.service=anki-ui
      - traefik.http.routers.anki-ui.priority=10
      - traefik.http.services.anki-ui.loadbalancer.server.port=3000
      - "traefik.http.routers.anki-api.rule=Host(`anki.louismollick.com`) && PathPrefix(`/api`)"
      - traefik.http.routers.anki-api.entrypoints=websecure
      - traefik.http.routers.anki-api.tls=true
      - traefik.http.routers.anki-api.tls.certresolver=le
      - traefik.http.routers.anki-api.service=anki-api
      - traefik.http.routers.anki-api.priority=100
      - traefik.http.routers.anki-api.middlewares=anki-api-strip
      - traefik.http.services.anki-api.loadbalancer.server.port=8765
      - traefik.http.middlewares.anki-api-strip.stripprefix.prefixes=/api
      - com.louismollick.anki-cleanup=true
      - com.centurylinklabs.watchtower.enable=true

  anki-cleanup:
    image: docker:27-cli@sha256:851f91d241214e7c6db86513b270d58776379aacc5eb9c4a87e5b47115e3065c
    restart: unless-stopped
    network_mode: none
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      TZ: UTC
    command:
      - /bin/sh
      - -c
      - |
        while true; do
          target="$$(docker ps -q --filter label=com.louismollick.anki-cleanup=true)"
          if [ -z "$$target" ]; then
            sleep 60
            continue
          fi

          health="$$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$$target")"
          memory="$$(docker stats --no-stream --format '{{.MemPerc}}' "$$target" | tr -d '%')"
          reason=""

          if [ "$$health" = "unhealthy" ]; then
            reason="Anki API unhealthy"
          elif awk -v percent="$$memory" 'BEGIN { exit !(percent >= 75) }'; then
            reason="memory at $${memory}%"
          fi

          if [ -n "$$reason" ]; then
            echo "$$(date -u +'%Y-%m-%dT%H:%M:%SZ') restarting Anki: $$reason"
            docker restart "$$target"
          fi

          sleep 60
        done
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  spotify-lyrics-api:
    image: ghcr.io/louismollick/spotify-lyrics-api:main
    restart: unless-stopped
    env_file:
      - .env-lyrics
    networks:
      - traefik-public
    labels:
      - traefik.enable=true
      - "traefik.http.routers.lyrics-api.rule=Host(`spotify-lyrics-api.louismollick.com`)"
      - traefik.http.routers.lyrics-api.entrypoints=websecure
      - traefik.http.routers.lyrics-api.tls=true
      - traefik.http.routers.lyrics-api.tls.certresolver=le
      - traefik.http.routers.lyrics-api.service=lyrics-api
      - traefik.http.services.lyrics-api.loadbalancer.server.port=8080
      - com.centurylinklabs.watchtower.enable=true

  navidrome:
    image: deluan/navidrome:latest
    restart: unless-stopped
    env_file:
      - .env-navidrome
    environment:
      ND_DATAFOLDER: /data
      ND_MUSICFOLDER: /music
      ND_SCANNER_PURGEMISSING: full
    volumes:
      - ./volumes/navidrome_data:/data
      - ./music:/music:ro
    networks:
      - traefik-public
    labels:
      - traefik.enable=true
      - "traefik.http.routers.navidrome.rule=Host(`music.louismollick.com`)"
      - traefik.http.routers.navidrome.entrypoints=websecure
      - traefik.http.routers.navidrome.tls=true
      - traefik.http.routers.navidrome.tls.certresolver=le
      - traefik.http.services.navidrome.loadbalancer.server.port=4533
      - com.centurylinklabs.watchtower.enable=true

  actual-server:
    image: docker.io/actualbudget/actual-server:26.3.0@sha256:eb8bc26f53025e07e464594c12d77c52c4b95840c8dadd9b95c4f0c4660f8ad2
    restart: unless-stopped
    volumes:
      - ./volumes/actual_data:/data
    networks:
      - traefik-public
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      - "traefik.http.routers.actual-server.rule=Host(`budget.louismollick.com`)"
      - traefik.http.routers.actual-server.entrypoints=websecure
      - traefik.http.routers.actual-server.tls=true
      - traefik.http.routers.actual-server.tls.certresolver=le
      - traefik.http.services.actual-server.loadbalancer.server.port=5006
      - com.centurylinklabs.watchtower.enable=true

  minecraft:
    image: itzg/minecraft-server:latest
    container_name: minecraft
    restart: unless-stopped
    ports:
      - "25565:25565"
    env_file:
      - ${MINECRAFT_SERVER_DIR:-/home/ubuntu/minecraft-server}/.env
    environment:
      EULA: "TRUE"
      TYPE: "PAPER"
      VERSION: "26.2"
      MEMORY: "5G"
      USE_AIKAR_FLAGS: "true"
      MAX_PLAYERS: "5"
      VIEW_DISTANCE: "16"
      SIMULATION_DISTANCE: "6"
      ONLINE_MODE: "TRUE"
      ENABLE_WHITELIST: "TRUE"
      ENFORCE_WHITELIST: "TRUE"
      WHITELIST: "Ruiisuuu,azerX420,Eskodas"
      OPS: "Ruiisuuu"
      ENABLE_RCON: "true"
      MOTD: "Friends Minecraft Server"
    volumes:
      - ${MINECRAFT_SERVER_DIR:-/home/ubuntu/minecraft-server}/data:/data
    healthcheck:
      test: ["CMD", "mc-health"]
      start_period: 2m
      interval: 30s
      timeout: 10s
      retries: 5

  minecraft-backup:
    image: itzg/mc-backup:latest
    container_name: minecraft-backup
    user: "1000:1000"
    restart: unless-stopped
    depends_on:
      minecraft:
        condition: service_healthy
    env_file:
      - ${MINECRAFT_SERVER_DIR:-/home/ubuntu/minecraft-server}/.env
    environment:
      RCON_HOST: "minecraft"
      BACKUP_INTERVAL: "24h"
      INITIAL_DELAY: "2m"
      PRUNE_BACKUPS_DAYS: "14"
      PAUSE_IF_NO_PLAYERS: "false"
    volumes:
      - ${MINECRAFT_SERVER_DIR:-/home/ubuntu/minecraft-server}/data:/data:ro
      - ${MINECRAFT_SERVER_DIR:-/home/ubuntu/minecraft-server}/backups:/backups

  watchtower:
    image: containrrr/watchtower:latest
    restart: unless-stopped
    environment:
      DOCKER_API_VERSION: "1.44"
    command:
      - --interval
      - "300"
      - --cleanup
      - --rolling-restart
      - --label-enable
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

networks:
  traefik-public:
    name: traefik-public
